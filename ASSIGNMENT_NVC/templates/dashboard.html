<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FR-5.1 Pipeline Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; color: #333; }
        .header { margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); text-align: center; }
        .card h3 { margin: 0 0 10px 0; font-size: 14px; color: #666; text-transform: uppercase; }
        .metric { font-size: 32px; font-weight: bold; }
        .received { color: #007bff; }
        .processed { color: #28a745; }
        .failed { color: #dc3545; }
        .flagged { color: #fd7e14; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Pipeline Ingestion Dashboard</h1>
        <p><strong>Daily Stats Date:</strong> {{ date }}</p>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Files Received</h3>
            <div class="metric received">{{ received }}</div>
        </div>
        <div class="card">
            <h3>Files Processed</h3>
            <div class="metric processed">{{ processed }}</div>
        </div>
        <div class="card">
            <h3>Files Failed</h3>
            <div class="metric failed">{{ failed }}</div>
        </div>
        <div class="card">
            <h3>Files Flagged</h3>
            <div class="metric flagged">{{ flagged }}</div>
        </div>
    </div>
</body>
</html>
